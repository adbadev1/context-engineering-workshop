name: get_agent_status
description: Get current workload and status of agents in the swarm.
allowed_phases: [PLAN, ACT, VERIFY]
produces: [Receipt]
inputs_schema:
  type: object
  required: [run_id]
  properties:
    run_id: {type: string}
    agent_id: {type: string}
outputs_schema:
  type: object
  required: [agents, receipt_id]
  properties:
    agents: {type: array}
    receipt_id: {type: string}
example_payload:
  run_id: run-demo
